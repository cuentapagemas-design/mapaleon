<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>León TOP 20 — Tapear · Cenar · Visitar</title>
  <meta name="description" content="El TOP 20 de sitios para tapear, cenar y visitar en León (España), rankeados por valoración y número de reseñas." />

  <!-- PWA -->
  <meta name="theme-color" content="#6b2c8f" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="León TOP 20" />

  <!-- Leaflet 1.9 desde CDN -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- App bar flotante -->
    <header id="appbar">
      <svg class="logo" viewBox="0 0 100 120" fill="currentColor" fill-rule="evenodd" aria-hidden="true">
        <path d="M6 42 L15 36 C12 27 19 19 28 21 L31 11 L37 19 L43 10 L47 19 L55 14 L54 26 C61 31 62 41 56 47 C64 50 67 60 62 68 C70 64 74 51 70 45 C75 47 78 55 73 63 C83 61 85 46 76 40 C80 33 78 23 69 23 C73 32 70 39 63 40 C66 33 60 28 53 31 C57 38 55 47 48 50 C57 55 63 66 64 82 C70 88 71 98 69 106 L77 109 L75 113 L63 110 C62 102 61 94 57 90 C54 92 51 93 48 92 C49 99 48 106 44 111 L52 114 L49 117 L39 112 C40 105 39 98 37 92 C35 86 34 77 34 66 C30 71 22 72 18 67 L27 64 C21 60 20 50 26 46 C20 47 13 43 15 36 Z M27 30 a2.1 2.1 0 1 1 0.1 0 Z"/>
      </svg>
      <span class="appbar-title">León <b>TOP&nbsp;20</b></span>
      <!-- Cuenta (Supabase) desactivada de momento; reactivar junto con Ofertas
      <button id="account-btn" class="icon-btn" type="button" aria-label="Cuenta">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6"/></svg>
      </button>
      -->
    </header>

    <!-- Mapa a pantalla completa -->
    <div id="map" role="application" aria-label="Mapa de León"></div>

    <!-- Anuncio banner flotante (oculto si no hay) -->
    <div id="ad-banner" hidden aria-label="Publicidad"></div>

    <!-- Hoja inferior deslizable con la lista -->
    <section id="sheet" data-state="peek" aria-label="Lista del TOP 20">
      <button id="sheet-handle" type="button" aria-label="Expandir o contraer la lista">
        <span class="grip"></span>
      </button>
      <div id="sheet-head">
        <div class="head-top">
          <h2 id="panel-title">Tapear</h2>
          <span id="result-count" class="result-count"></span>
        </div>
        <input id="search-input" class="search-input" type="search" placeholder="Buscar por nombre…" autocomplete="off" />
        <div class="controls-row">
          <select id="sort-select" class="sort-select" aria-label="Ordenar">
            <option value="ranking">Ranking</option>
            <option value="rating">Mejor valorados</option>
            <option value="reviews">Más reseñas</option>
            <option value="az">A–Z</option>
          </select>
          <button id="open-toggle" class="fchip" type="button" aria-pressed="false"><span class="dot"></span>Abierto</button>
          <button class="fchip price-chip" data-price="1" type="button" aria-pressed="false">€</button>
          <button class="fchip price-chip" data-price="2" type="button" aria-pressed="false">€€</button>
          <button class="fchip price-chip" data-price="3" type="button" aria-pressed="false">€€€</button>
          <button id="surprise-btn" class="fchip surprise-chip" type="button">🎲 Sorpréndeme</button>
          <button id="saved-toggle" class="fchip" type="button" aria-pressed="false" hidden>★ Guardados</button>
        </div>
        <p id="updated">Cargando…</p>
      </div>
      <ol id="ranking-list"></ol>
      <footer id="attribution">
        Lugares: Google · Mapa © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>,
        <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a> · <a href="admin.html">Admin</a>
      </footer>
    </section>

    <!-- Barra de categorías inferior -->
    <nav id="tabbar" aria-label="Categorías">
      <button class="tab is-active" data-cat="tapeo" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10l-1.2 8.2a4 4 0 0 1-7.6 0L7 3Z"/><path d="M12 14v5M8.5 21h7"/></svg>
        <span>Tapear</span>
      </button>
      <button class="tab" data-cat="comida" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v7a2 2 0 0 0 2 2M9 3v6M6 3v3M9 12v9"/><path d="M16 3c2 1 2.5 5 0 7v11"/></svg>
        <span>Cenar</span>
      </button>
      <button class="tab" data-cat="visitar" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9 12 4l8 5"/><path d="M5 9v9M9.7 9v9M14.3 9v9M19 9v9M3 21h18"/></svg>
        <span>Visitar</span>
      </button>
      <button class="tab" data-cat="favoritos" type="button" id="fav-btn">
        <span class="tab-badge" id="fav-badge" hidden>0</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 17l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>
        <span>Favoritos</span>
      </button>
      <!-- Pestaña Ofertas (descuentos) desactivada de momento; reactivar cuando haya BD
      <button class="tab" data-cat="descuentos" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13 11 6h7v7l-7 7z"/><circle cx="14.5" cy="9.5" r="1.3"/><path d="M9 15l4-4"/></svg>
        <span>Ofertas</span>
      </button>
      -->
    </nav>

    <!-- Ficha de sitio (detalle) -->
    <div id="detail" class="detail" hidden>
      <div class="detail-card" role="dialog" aria-modal="true" aria-label="Ficha del sitio">
        <button id="detail-close" class="detail-close" type="button" aria-label="Volver">←</button>
        <div id="detail-body"></div>
      </div>
    </div>

    <!-- Modal de cuenta / acceso (enlace mágico) -->
    <div id="auth-modal" class="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="auth-title">
        <button class="modal-close" id="auth-close" type="button" aria-label="Cerrar">×</button>
        <div id="auth-body"><!-- lo rellena app.js --></div>
      </div>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script src="app.js"></script>
</body>
</html>
